services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homelibrary-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-974915GTRy}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-974915GTRy}
    volumes:
      - ./Database:/scripts:ro
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        for f in /scripts/*.sql; do
          echo "Applying $$f"
          /opt/mssql-tools18/bin/sqlcmd -C -I -b -S db -U sa -P "$$MSSQL_SA_PASSWORD" -i "$$f"
        done
        echo "Database is ready"

volumes:
  sqldata: